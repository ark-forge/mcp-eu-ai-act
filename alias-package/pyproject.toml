[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-eu-ai-act"
version = "2.0.38"
description = "Alias package — installs eu-ai-act-scanner (EU AI Act + GDPR compliance scanner, CLI + MCP server)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "eu-ai-act-scanner>=2.0.35",
]
keywords = [
    "EU AI Act",
    "MCP",
    "compliance",
    "scanner",
    "alias",
]

[project.urls]
Homepage = "https://github.com/ark-forge/mcp-eu-ai-act"
Repository = "https://github.com/ark-forge/mcp-eu-ai-act"
"PyPI (main package)" = "https://pypi.org/project/eu-ai-act-scanner/"
Pricing = "https://arkforge.tech/en/pricing.html?utm_source=pypi&utm_medium=pypi_sidebar&utm_campaign=mcp_euaiact"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_eu_ai_act"]
