name: Supply chain

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the hash-locked set
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Tests
        run: pytest -q tests
      - name: Audit dependencies (PyPI and OSV advisories)
        run: |
          pip install pip-audit
          pip-audit --require-hashes --disable-pip -r requirements-dev.lock
          pip-audit --require-hashes --disable-pip -r requirements-dev.lock --vulnerability-service osv

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Locks match their inputs (uv, hashes)
        run: |
          pip install uv
          for f in requirements requirements-dev; do
            uv pip compile $f.in --python-platform linux --python-version 3.14 --generate-hashes -q -o /tmp/$f.lock
            diff <(grep -v '^#' $f.lock) <(grep -v '^#' /tmp/$f.lock) || { echo "$f.lock is stale: run uv pip compile"; exit 1; }
          done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secrets in the whole history (reviewed findings in .gitleaksignore)
        run: |
          curl -sSfL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact -v .

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: CycloneDX SBOM of the locked runtime set
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.lock --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
