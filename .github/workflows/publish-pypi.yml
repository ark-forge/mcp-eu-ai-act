name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (e.g. PYPI_TOKEN or Trusted Publisher now configured)'
        required: false
        default: 'manual'

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    # NOTE: 'environment: pypi' is required for Trusted Publishing.
    # Alternatively, set PYPI_TOKEN secret in repo settings (no environment needed).
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Check PYPI_TOKEN availability
        id: check_pypi
        run: |
          if [ -n "$PYPI_TOKEN_VAL" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::PYPI_TOKEN not set — attempting OIDC Trusted Publishing"
          fi
        env:
          PYPI_TOKEN_VAL: ${{ secrets.PYPI_TOKEN }}

      - name: Publish to PyPI (API token)
        if: steps.check_pypi.outputs.available == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
          attestations: false

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: steps.check_pypi.outputs.available == 'false'
        # Requires Trusted Publisher configured on pypi.org:
        #   Owner: ark-forge | Repo: mcp-eu-ai-act | Workflow: publish-pypi.yml | Env: pypi
        # Setup: https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Verify main package publish
        run: |
          sleep 10
          curl -sf "https://pypi.org/pypi/eu-ai-act-scanner/json" > /dev/null 2>&1 && echo "eu-ai-act-scanner found on PyPI" || echo "::warning::eu-ai-act-scanner not yet visible on PyPI"

  publish-alias:
    runs-on: ubuntu-latest
    needs: publish-pypi
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build alias package
        working-directory: alias-package
        run: python -m build

      - name: Check alias project status
        id: check_alias
        run: |
          if curl -sf "https://pypi.org/pypi/mcp-eu-ai-act/json" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$PYPI_TOKEN_VAL" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
          fi
        env:
          PYPI_TOKEN_VAL: ${{ secrets.PYPI_TOKEN }}

      - name: Publish alias to PyPI (API token)
        if: steps.check_alias.outputs.exists == 'true' && steps.check_alias.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: alias-package/dist/
          skip-existing: true

      - name: Publish alias to PyPI (Trusted Publishing / OIDC)
        if: steps.check_alias.outputs.exists == 'true' && steps.check_alias.outputs.has_token == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: alias-package/dist/
          skip-existing: true

      - name: First-time publish alias
        if: steps.check_alias.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::warning::Cannot create mcp-eu-ai-act on PyPI without PYPI_TOKEN. Configure a Pending Trusted Publisher at pypi.org/manage/account/publishing or set PYPI_TOKEN secret."
            exit 0
          fi
          python -m twine upload alias-package/dist/* --skip-existing 2>&1 || {
            echo "::warning::Alias upload failed — verify email at pypi.org/manage/account then re-run this workflow."
            exit 0
          }

      - name: Verify alias package
        run: |
          sleep 10
          if curl -sf "https://pypi.org/pypi/mcp-eu-ai-act/json" > /dev/null 2>&1; then
            echo "mcp-eu-ai-act found on PyPI"
          else
            echo "::notice::mcp-eu-ai-act not yet on PyPI — verify email at pypi.org/manage/account then re-run"
          fi
